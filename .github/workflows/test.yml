name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: "3.12.14"

      - name: Backtest tests (Python)
        run: uv run --with pandas --with numpy --with pyarrow --with pytest pytest backtest -q

      - name: Domain and calendar tests (Python)
        run: uv run --with pytest pytest tests/domain/test_calendar.py tests/domain/test_supply_hint.py tests/domain/test_run_state.py tests/batch/test_calendar.py -q

      - name: Tooling gate tests (Python)
        run: uv run --with pytest --with pyyaml pytest tests/tools -q

      # sprint-status.yaml은 손으로 편집하는 action item 원장이고 bmad 스킬이 파싱한다.
      # 커밋된 상태로 유효하지 않은 YAML이었던 전례가 있어(잔여 쉼표) 계약을 게이트한다.
      - name: Sprint status contract (Python)
        run: uv run --with pyyaml python tools/check_sprint_status.py

      - name: Scheduler tests (Python)
        run: uv run --with pytest pytest tests/batch/test_scheduler.py tests/batch/test_supabase_client.py tests/batch/test_ls_auth.py tests/batch/test_ls_daily_bar.py tests/batch/test_run_state.py tests/batch/test_candidate_stage.py tests/batch/test_ls_client.py tests/batch/test_ohlcv_cache.py tests/batch/test_main.py tests/batch/test_supply_stage.py tests/batch/test_ls_supply_provider.py tests/batch/test_ls_market_supply_provider.py tests/batch/test_ls_market_program_supply_provider.py tests/batch/test_market_supply_stage.py tests/batch/test_market_supply_repository.py tests/batch/test_tagged_candidate_fetcher.py tests/batch/test_supply_3day_repository.py tests/batch/test_bias_repository.py tests/batch/test_bias_stage.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck (JS)
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test

      - name: Build web
        run: npm run build -w apps/web

      # epic-1-retro-item-5 (F6): committed read-model 타입과 프로덕션 스키마의 diff gate.
      # SUPABASE_ACCESS_TOKEN(기본 브랜치/수동 실행에만 존재)이 있을 때만 재생성해서
      # git diff --exit-code로 drift를 차단한다. PR에서 token이 없으면 offline lint
      # (sql-schema-tests 잡)로 대체된다.
      - name: Regenerate read-model types and diff (production)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm run generate:read-model-types
          if ! git diff --exit-code -- packages/read-model/src/database.types.ts; then
            echo "::error::generated read-model types differ from production schema; run npm run generate:read-model-types and commit"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test (web)
        run: npm run test:e2e

  sql-schema-tests:
    # Story 1.10 후속으로 dispatch_outbox RPC 회귀 검증에서 시작했으나, 이후 스토리마다
    # 자신의 스키마 계약을 검증하는 fixture를 이 잡에 계속 추가하는 구조로 넓어졌다(현재는
    # Story 3.1 outcome 스키마 fixture까지 포함). pg_cron/pg_net 확장이 필요한
    # 202609021100_schedule_dispatch_worker_cron.sql만 제외하고 나머지 migration을 순서대로
    # 적용한 뒤 fixture를 실행한다(fixture 자체가 `begin`/`rollback`으로 감싸여 있어 상태를 남기지 않는다).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate migration order contract
        run: python tools/check_migration_order.py

      # migration들이 grant/revoke 대상으로 참조하는 Supabase 플랫폼 기본 롤은
      # 순정 postgres:16 이미지에 존재하지 않는다. 이 롤들이 없으면 첫 grant/revoke에서
      # "role does not exist"로 즉시 죽는다(sql-schema-tests가 그동안 항상 실패해온 원인).
      # CREATE ROLE은 클러스터 단위라 이후 N/N-1 스텝의 nm1/full_apply DB에도 그대로 적용된다.
      #
      # 실제 Supabase 프로젝트는 anon/authenticated에 public 스키마 기본 권한(테이블 전체
      # SELECT 등)을 광범위하게 주고 RLS만으로 행을 막는 구조다(GRANT가 아니라 RLS가 실제
      # 게이트). ALTER DEFAULT PRIVILEGES는 데이터베이스 단위라 여기서 지금 설정해 둬야
      # 이후 "Apply migrations"가 만드는 테이블에 적용된다 -- 안 해두면 RLS가 0건을
      # 반환해야 할 자리에서 애초에 "permission denied for table"로 막혀 SQL fixture의
      # RLS 검증 자체가 불가능해진다(2026-09-14 조사).
      - name: Bootstrap Supabase platform roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end
          $$;

          grant usage on schema public to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on functions to anon, authenticated, service_role;
          SQL

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$f" in
              *schedule_dispatch_worker_cron.sql) echo "skipping $f (requires pg_cron/pg_net, not available in CI)"; continue ;;
            esac
            echo "applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # epic-1-retro-item-5 (F5/F6): N/N-1 forward-upgrade 호환성 gate.
      # 마지막 migration을 제외한(N-1) DB에 새 migration 하나(N)를 적용했을 때,
      # clean DB에 전체 migration을 순서대로 적용했을 때와 동일한 스키마가 되는지
      # pg_dump --schema-only diff로 검증한다. forward-only migration이 이전 스키마를
      # 깨뜨리거나 clean apply에만 성립하는 순서 의존을 만드는 drift를 PR CI에서 차단한다.
      - name: N/N-1 forward-upgrade schema parity
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -c "create database nm1;"
          psql -h localhost -U postgres -d postgres -c "create database full_apply;"

          # N-1: 마지막 migration을 제외하고 적용
          last=$(ls infra/supabase/migrations/*.sql | sort | tail -n 1)
          lastname=$(basename "$last")
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$(basename "$f")" in
              *schedule_dispatch_worker_cron.sql) continue ;;
              "$lastname") echo "N-1: excluding $lastname"; continue ;;
            esac
            psql -h localhost -U postgres -d nm1 -v ON_ERROR_STOP=1 -f "$f"
          done

          # full_apply: 전체 migration 적용 (기준 스킴, N)
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$(basename "$f")" in
              *schedule_dispatch_worker_cron.sql) continue ;;
            esac
            psql -h localhost -U postgres -d full_apply -v ON_ERROR_STOP=1 -f "$f"
          done

          # pg_dump 16.10+는 \restrict/\unrestrict에 매 실행마다 무작위 토큰을 찍는다(보안 기능,
          # 스키마 내용과 무관). 그대로 두면 스키마가 완전히 같아도 diff가 항상 실패한다.
          dump_schema_only() {
            pg_dump -h localhost -U postgres -d "$1" --schema-only --no-owner --no-comments \
              | grep -v '^\\restrict \|^\\unrestrict '
          }

          dump_schema_only nm1 > /tmp/nm1_before.sql
          psql -h localhost -U postgres -d nm1 -v ON_ERROR_STOP=1 -f "$last"
          dump_schema_only nm1 > /tmp/nm1_after.sql
          dump_schema_only full_apply > /tmp/full_apply.sql

          if ! diff -u /tmp/nm1_after.sql /tmp/full_apply.sql; then
            echo "::error::N-1 + '$lastname' upgrade schema != clean full-apply schema"
            exit 1
          fi
          if diff -u /tmp/nm1_before.sql /tmp/nm1_after.sql > /tmp/n_change.diff; then
            echo "::warning::N-1 -> N upgrade produced no schema change for '$lastname'"
          else
            echo "N-1 -> N schema delta lines: $(wc -l < /tmp/n_change.diff)"
          fi
          echo "N/N-1 forward-upgrade parity passed (last=$lastname)"

      - name: Generated read-model type drift lint (offline)
        run: python tools/check_generated_types_drift.py

      # epic-3-retro-item-15 / epic-6-retro-item-23: 커밋된 프로덕션 스냅샷 대비 역방향 drift 차단.
      # 로컬이 baseline보다 앞선 것(배포 대기)은 WARN이므로 PR에서 통과한다.
      - name: Production parity check (offline, baseline)
        run: python tools/check_production_parity.py

      # epic-3-retro-item-17: rebuild fixture의 JSON 사본이 SQL과 갈라지는 것을 차단한다
      # (JSON 쪽은 어떤 코드도 읽지 않으므로 한쪽만 고쳐도 아무도 알아채지 못했다).
      - name: Outcome rebuild fixture drift check
        run: python tools/check_outcome_rebuild_fixture_drift.py

      # story 5-5: 승률·PF fixture의 JSON ↔ SQL ↔ Python 기준값 3중 동등성 검증
      - name: Outcome win_rate_pf parity check
        run: python tools/check_outcome_win_rate_pf_parity.py

      # story 5-6: 전략×원천 분리 승률·PF fixture의 JSON ↔ SQL ↔ Python 기준값 4중 동등성 검증
      - name: Outcome win_rate_pf by_strategy_source parity check
        run: python tools/check_outcome_win_rate_pf_source_parity.py

      # story 5-7: 표본 게이트(30건) fixture의 JSON ↔ SQL ↔ Python 기준값 동등성 검증
      # (경계값 29건 vs 30건 포함)
      - name: Outcome win_rate_pf gate parity check
        run: python tools/check_outcome_win_rate_pf_gate_parity.py

      # story 5-8: 95% Wilson score 신뢰구간 & 기대치 판정 fixture의 JSON ↔ SQL ↔ Python
      # 기준값 동등성 검증(CI 안/밖·게이트 미통과·기대치 없는 전략 D 포함)
      - name: Outcome win_rate_pf ci gated parity check
        run: python tools/check_outcome_win_rate_pf_ci_parity.py

      # story 5-9: 5-8 CI 판정을 보존한 이탈 임계값 보조 표시의 JSON ↔ SQL ↔ Python
      # 기준값 4중 동등성 검증(정상·초과·정확 경계·게이트/기대치 NULL)
      - name: Outcome win_rate_pf threshold gated parity check
        run: python tools/check_outcome_win_rate_pf_threshold_parity.py

      # story 5-10: 5-9 성과 판정을 보존한 컷오프 편향 고지의 JSON ↔ SQL ↔ Python
      # 기준값·정밀도·A/B/C 매핑·D/E/F/rollup NULL 계약 동등성 검증
      - name: Outcome cutoff bias notice parity check
        run: python tools/check_outcome_cutoff_bias_notice_parity.py

      # epic-3-retro-item-17 (fixture 자동 수집): 이전에는 fixture 경로를 이 자리에 손으로
      # 나열했다 -- 새 fixture를 추가하고 이 목록에 넣는 것을 잊으면 CI가 조용히 통과했다.
      # 이제 tests/sql/*.sql 전체를 정렬해 돌리므로 파일을 두는 것만으로 게이트에 들어온다.
      - name: Run schema SQL fixtures
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=(tests/sql/test_*.sql)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "::error::tests/sql에 SQL fixture가 없다 -- 수집 경로가 잘못됐다"
            exit 1
          fi
          echo "collected ${#fixtures[@]} SQL fixtures"
          for f in $(printf '%s\n' "${fixtures[@]}" | sort); do
            echo "running $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

  # epic-3-retro-item-15 / epic-6-retro-item-23: default-branch 배포 gate.
  # "로컬 SQL fixture는 pass인데 운영에 함수/migration이 없다"는 6-6 drift 재발 전례를
  # 차단한다. sql-schema-tests(로컬 fixture)가 녹색인 것만으로 배포를 허용하지 않고,
  # live 프로덕션(qqhjeumlecaudsiqhhdu)의 schema_migrations와 public 함수 catalog를
  # 실측 조회해 로컬 선언과 대조한다. 읽기 전용 SQL만 실행한다.
  #
  # PR/fork에는 SUPABASE_ACCESS_TOKEN이 없으므로 default branch(및 수동 실행)에서만 돈다.
  # baseline 갱신이 필요하면 `python tools/check_production_parity.py --write-baseline`.
  production-parity-gate:
    needs: sql-schema-tests
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Production parity gate (live)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret이 없어 배포 gate를 실행할 수 없다"
            exit 1
          fi
          python tools/check_production_parity.py --gate
