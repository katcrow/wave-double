name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-version: "0.11.28"
          python-version: "3.12.14"

      - name: Backtest tests (Python)
        run: uv run --with pandas --with numpy --with pyarrow --with pytest pytest backtest -q

      - name: Domain and calendar tests (Python)
        run: uv run --with pytest pytest tests/domain/test_calendar.py tests/domain/test_supply_hint.py tests/batch/test_calendar.py -q

      - name: Scheduler tests (Python)
        run: uv run --with pytest pytest tests/batch/test_scheduler.py tests/batch/test_supabase_client.py tests/batch/test_ls_auth.py tests/batch/test_ls_daily_bar.py tests/batch/test_run_state.py tests/batch/test_candidate_stage.py tests/batch/test_ls_client.py tests/batch/test_ohlcv_cache.py tests/batch/test_main.py tests/batch/test_supply_stage.py tests/batch/test_ls_supply_provider.py tests/batch/test_ls_market_supply_provider.py tests/batch/test_ls_market_program_supply_provider.py tests/batch/test_market_supply_stage.py tests/batch/test_market_supply_repository.py tests/batch/test_tagged_candidate_fetcher.py tests/batch/test_supply_3day_repository.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck (JS)
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test

      - name: Build web
        run: npm run build -w apps/web

      # epic-1-retro-item-5 (F6): committed read-model 타입과 프로덕션 스키마의 diff gate.
      # SUPABASE_ACCESS_TOKEN(기본 브랜치/수동 실행에만 존재)이 있을 때만 재생성해서
      # git diff --exit-code로 drift를 차단한다. PR에서 token이 없으면 offline lint
      # (sql-schema-tests 잡)로 대체된다.
      - name: Regenerate read-model types and diff (production)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm run generate:read-model-types
          if ! git diff --exit-code -- packages/read-model/src/database.types.ts; then
            echo "::error::generated read-model types differ from production schema; run npm run generate:read-model-types and commit"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test (web)
        run: npm run test:e2e

  sql-schema-tests:
    # Story 1.10 후속으로 dispatch_outbox RPC 회귀 검증에서 시작했으나, 이후 스토리마다
    # 자신의 스키마 계약을 검증하는 fixture를 이 잡에 계속 추가하는 구조로 넓어졌다(현재는
    # Story 3.1 outcome 스키마 fixture까지 포함). pg_cron/pg_net 확장이 필요한
    # 202609021100_schedule_dispatch_worker_cron.sql만 제외하고 나머지 migration을 순서대로
    # 적용한 뒤 fixture를 실행한다(fixture 자체가 `begin`/`rollback`으로 감싸여 있어 상태를 남기지 않는다).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate migration order contract
        run: python tools/check_migration_order.py

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$f" in
              *schedule_dispatch_worker_cron.sql) echo "skipping $f (requires pg_cron/pg_net, not available in CI)"; continue ;;
            esac
            echo "applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # epic-1-retro-item-5 (F5/F6): N/N-1 forward-upgrade 호환성 gate.
      # 마지막 migration을 제외한(N-1) DB에 새 migration 하나(N)를 적용했을 때,
      # clean DB에 전체 migration을 순서대로 적용했을 때와 동일한 스키마가 되는지
      # pg_dump --schema-only diff로 검증한다. forward-only migration이 이전 스키마를
      # 깨뜨리거나 clean apply에만 성립하는 순서 의존을 만드는 drift를 PR CI에서 차단한다.
      - name: N/N-1 forward-upgrade schema parity
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -c "create database nm1;"
          psql -h localhost -U postgres -d postgres -c "create database full_apply;"

          # N-1: 마지막 migration을 제외하고 적용
          last=$(ls infra/supabase/migrations/*.sql | sort | tail -n 1)
          lastname=$(basename "$last")
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$(basename "$f")" in
              *schedule_dispatch_worker_cron.sql) continue ;;
              "$lastname") echo "N-1: excluding $lastname"; continue ;;
            esac
            psql -h localhost -U postgres -d nm1 -v ON_ERROR_STOP=1 -f "$f"
          done

          # full_apply: 전체 migration 적용 (기준 스킴, N)
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$(basename "$f")" in
              *schedule_dispatch_worker_cron.sql) continue ;;
            esac
            psql -h localhost -U postgres -d full_apply -v ON_ERROR_STOP=1 -f "$f"
          done

          pg_dump -h localhost -U postgres -d nm1 --schema-only --no-owner --no-comments > /tmp/nm1_before.sql
          psql -h localhost -U postgres -d nm1 -v ON_ERROR_STOP=1 -f "$last"
          pg_dump -h localhost -U postgres -d nm1 --schema-only --no-owner --no-comments > /tmp/nm1_after.sql
          pg_dump -h localhost -U postgres -d full_apply --schema-only --no-owner --no-comments > /tmp/full_apply.sql

          if ! diff -u /tmp/nm1_after.sql /tmp/full_apply.sql; then
            echo "::error::N-1 + '$lastname' upgrade schema != clean full-apply schema"
            exit 1
          fi
          if diff -u /tmp/nm1_before.sql /tmp/nm1_after.sql > /tmp/n_change.diff; then
            echo "::warning::N-1 -> N upgrade produced no schema change for '$lastname'"
          else
            echo "N-1 -> N schema delta lines: $(wc -l < /tmp/n_change.diff)"
          fi
          echo "N/N-1 forward-upgrade parity passed (last=$lastname)"

      - name: Generated read-model type drift lint (offline)
        run: python tools/check_generated_types_drift.py

      - name: Run schema SQL fixtures
        env:
          PGPASSWORD: postgres
        run: |
          for f in tests/sql/test_run_lineage.sql tests/sql/test_candidates.sql tests/sql/test_candidates_fallback.sql tests/sql/test_skip_attempt.sql tests/sql/test_dashboard_snapshot.sql tests/sql/test_dispatch_outbox.sql tests/sql/test_daily_ohlcv.sql tests/sql/test_candidate_tags.sql tests/sql/test_candidate_tags_upgrade.sql tests/sql/test_supply_3day.sql tests/sql/test_market_supply.sql tests/sql/test_get_market_supply.sql tests/sql/test_get_today_candidate_cards.sql tests/sql/test_get_candidate_evidence.sql tests/sql/test_sync_vanished_tags.sql tests/sql/test_get_today_disappeared_candidates.sql tests/sql/test_outcome_schema.sql tests/sql/test_outcome_open_command.sql tests/sql/test_outcome_rebuild.sql tests/sql/test_supply_3day_publish_guard.sql tests/sql/test_supply_hints.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
