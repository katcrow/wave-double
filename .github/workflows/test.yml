name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-version: "0.11.28"
          python-version: "3.12.14"

      - name: Backtest tests (Python)
        run: uv run --with pandas --with numpy --with pyarrow --with pytest pytest backtest -q

      - name: Calendar tests (Python)
        run: uv run --with pytest pytest tests/domain/test_calendar.py tests/batch/test_calendar.py -q

      - name: Scheduler tests (Python)
        run: uv run --with pytest pytest tests/batch/test_scheduler.py tests/batch/test_supabase_client.py tests/batch/test_ls_auth.py tests/batch/test_ls_daily_bar.py tests/batch/test_run_state.py tests/batch/test_candidate_stage.py tests/batch/test_ls_client.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck (JS)
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test

      - name: Build web
        run: npm run build -w apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test (web)
        run: npm run test:e2e
