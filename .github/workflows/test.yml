name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-version: "0.11.28"
          python-version: "3.12.14"

      - name: Backtest tests (Python)
        run: uv run --with pandas --with numpy --with pyarrow --with pytest pytest backtest -q

      - name: Calendar tests (Python)
        run: uv run --with pytest pytest tests/domain/test_calendar.py tests/batch/test_calendar.py -q

      - name: Scheduler tests (Python)
        run: uv run --with pytest pytest tests/batch/test_scheduler.py tests/batch/test_supabase_client.py tests/batch/test_ls_auth.py tests/batch/test_ls_daily_bar.py tests/batch/test_run_state.py tests/batch/test_candidate_stage.py tests/batch/test_ls_client.py tests/batch/test_ohlcv_cache.py tests/batch/test_main.py tests/batch/test_supply_stage.py tests/batch/test_ls_supply_provider.py tests/batch/test_ls_market_supply_provider.py tests/batch/test_ls_market_program_supply_provider.py tests/batch/test_market_supply_stage.py tests/batch/test_market_supply_repository.py tests/batch/test_tagged_candidate_fetcher.py tests/batch/test_supply_3day_repository.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck (JS)
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test

      - name: Build web
        run: npm run build -w apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test (web)
        run: npm run test:e2e

  sql-schema-tests:
    # Story 1.10 후속으로 dispatch_outbox RPC 회귀 검증에서 시작했으나, 이후 스토리마다
    # 자신의 스키마 계약을 검증하는 fixture를 이 잡에 계속 추가하는 구조로 넓어졌다(현재는
    # Story 3.1 outcome 스키마 fixture까지 포함). pg_cron/pg_net 확장이 필요한
    # 202609021100_schedule_dispatch_worker_cron.sql만 제외하고 나머지 migration을 순서대로
    # 적용한 뒤 fixture를 실행한다(fixture 자체가 `begin`/`rollback`으로 감싸여 있어 상태를 남기지 않는다).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate migration order contract
        run: python tools/check_migration_order.py

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            case "$f" in
              *schedule_dispatch_worker_cron.sql) echo "skipping $f (requires pg_cron/pg_net, not available in CI)"; continue ;;
            esac
            echo "applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run schema SQL fixtures
        env:
          PGPASSWORD: postgres
        run: |
          for f in tests/sql/test_run_lineage.sql tests/sql/test_candidates.sql tests/sql/test_candidates_fallback.sql tests/sql/test_skip_attempt.sql tests/sql/test_dashboard_snapshot.sql tests/sql/test_dispatch_outbox.sql tests/sql/test_daily_ohlcv.sql tests/sql/test_candidate_tags.sql tests/sql/test_candidate_tags_upgrade.sql tests/sql/test_supply_3day.sql tests/sql/test_market_supply.sql tests/sql/test_get_market_supply.sql tests/sql/test_get_today_candidate_cards.sql tests/sql/test_get_candidate_evidence.sql tests/sql/test_sync_vanished_tags.sql tests/sql/test_get_today_disappeared_candidates.sql tests/sql/test_outcome_schema.sql tests/sql/test_outcome_open_command.sql tests/sql/test_outcome_rebuild.sql tests/sql/test_supply_3day_publish_guard.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
