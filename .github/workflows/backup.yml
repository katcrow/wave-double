name: backup

# spec-1-12 (AD-17): 무료 Supabase 플랜에는 PITR이 없다. 6시간마다 transaction-consistent
# pg_dump를 만들어 age로 암호화하고 GitHub Actions artifact(14일 보관)로 남긴다. schedule
# 이벤트는 fork에서 실행되지 않으므로(GitHub 기본 동작) production secret이 fork로 새지 않는다
# (AD-11, scheduled-batch.yml과 동일 관례) -- 그래서 pull_request 트리거는 절대 두지 않는다.
on:
  schedule:
    # UTC 00/06/12/18시 = 6시간 간격.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: wave-double-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump and age
        run: |
          # 운영 Supabase는 PostgreSQL 17.x를 쓰는데, Ubuntu 24.04 기본 apt 저장소의
          # postgresql-client는 16.x라 pg_dump가 "server version mismatch"로 즉시
          # 거부한다(2026-09-14 조사). PGDG 공식 저장소를 추가해 17을 설치한다.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age

      - name: Determine schema migration version and cutoff
        id: meta
        run: |
          version=$(ls infra/supabase/migrations/*.sql | sort | tail -n1 | xargs basename)
          cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"
          echo "artifact_name=wave-double-backup-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Dump, encrypt, and build manifest
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          SCHEMA_MIGRATION_VERSION: ${{ steps.meta.outputs.version }}
          CUTOFF_UTC: ${{ steps.meta.outputs.cutoff }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          plain="$workdir/dump.sql"
          encrypted="$workdir/backup.sql.age"

          # transaction-consistent 스냅샷은 pg_dump가 기본으로 보장한다(내부적으로 REPEATABLE READ
          # 트랜잭션 하나로 전체 덤프를 읽는다) -- 별도 플래그가 필요 없다. `--single-transaction`은
          # psql(복원 시 전체를 한 트랜잭션으로 묶는 옵션)에만 존재하고 pg_dump에는 없는 옵션이라,
          # 지금까지 이 스텝은 매번 "unrecognized option"으로 즉시 죽고 있었다(2026-09-14 조사).
          # --no-owner --no-privileges: 복원 대상(disposable Postgres, backup-restore-drill.yml)에는
          # Supabase 전용 role(anon/authenticated/service_role 등)이 없으므로, 이 role을 참조하는
          # OWNER TO / GRANT 구문이 덤프에 섞이면 plain psql -f 복원이 깨진다. 데이터·스키마 자체의
          # transaction-consistency와는 무관한 순수 이식성 옵션이다.
          pg_dump --format=plain --no-owner --no-privileges \
            "$SUPABASE_DB_URL" > "$plain"

          age -r "$BACKUP_AGE_PUBLIC_KEY" -o "$encrypted" "$plain"

          # 평문 덤프는 워크플로 종료 전에 반드시 삭제한다.
          shred -u "$plain" 2>/dev/null || rm -f "$plain"

          checksum=$(sha256sum "$encrypted" | cut -d' ' -f1)

          cat > "$workdir/manifest.json" <<JSON
          {
            "schema_migration_version": "$SCHEMA_MIGRATION_VERSION",
            "cutoff_utc": "$CUTOFF_UTC",
            "checksum_sha256": "$checksum"
          }
          JSON

          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup + manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.dump.outputs.workdir }}/backup.sql.age
            ${{ steps.dump.outputs.workdir }}/manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh issue create --label은 라벨이 저장소에 미리 존재해야 하므로(REST API의 issue 생성과
          # 달리 자동 생성되지 않는다), 실패 시점에 idempotent하게 먼저 만들어 둔다.
          gh label create backup-failed --color d73a4a --description "backup.yml 실패" --force

          # 지속 장애 시 매 6시간(또는 반복 workflow_dispatch)마다 새 Issue가 쌓이지 않도록, 같은
          # 라벨의 열린 Issue가 이미 있으면 새로 만들지 않는다.
          existing_open=$(gh issue list --label backup-failed --state open --json number --jq 'length')
          if [ "$existing_open" -gt 0 ]; then
            echo "backup-failed 라벨의 열린 Issue가 이미 있어 새로 만들지 않습니다."
            exit 0
          fi

          gh issue create \
            --title "[backup] backup.yml 실패 ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --label backup-failed \
            --body "$(cat <<'EOF'
          backup.yml 워크플로가 실패했습니다.

          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          필요 조치: 위 run 로그를 확인하고(secret 값은 노출되지 않습니다), 원인을 해결한 뒤
          workflow_dispatch로 수동 재실행하세요(AD-17, docs/backup-restore.md 참고).
          EOF
          )"
