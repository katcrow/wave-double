name: backup-restore-drill

# spec-1-12 (AD-17): backup.yml이 만든 최신 암호화 백업이 실제로 복원 가능한지, 분기 1회
# 자동으로(그리고 언제든 workflow_dispatch로 수동) 검증한다. disposable Postgres에 복원한 뒤
# 신규 migration을 적용하고 기존 SQL fixture(test_dashboard_snapshot.sql, test_run_lineage.sql)로
# read-model 계약과 canonical pointer 정합을 확인하며, RPO/RTO 실측치를 로그에 남긴다.
on:
  schedule:
    # 1/4/7/10월 1일 UTC 00:00, 분기 1회.
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: wave-double-backup-restore-drill
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  RPO_LIMIT_HOURS: 6

jobs:
  restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record start time (RTO measurement)
        run: echo "DRILL_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Install psql client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client age jq unzip

      - name: Find latest backup artifact
        id: find-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --paginate와 --jq를 같이 쓰면 --jq는 페이지마다 개별 적용되므로(페이지를 합친 뒤
          # 적용되지 않는다), sort_by(.created_at) | last가 "전체 중 최신"이 아니라 "각 페이지 중
          # 최신"을 고를 수 있다. --jq '.artifacts[]'로 각 페이지의 원소만 flatten해 스트림으로
          # 뽑아낸 뒤 jq -s(slurp)로 전체를 모아서 한 번에 정렬·선택한다.
          artifact_json=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[]' \
            | jq -s '[.[] | select(.name | startswith("wave-double-backup-")) | select(.expired == false)] | sort_by(.created_at) | last')

          if [ -z "$artifact_json" ] || [ "$artifact_json" = "null" ]; then
            echo "::error::no non-expired wave-double-backup-* artifact found"
            exit 1
          fi

          echo "artifact_id=$(echo "$artifact_json" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(echo "$artifact_json" | jq -r '.name')" >> "$GITHUB_OUTPUT"

      - name: Download and decrypt latest backup
        id: restore-prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_AGE_PRIVATE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
          ARTIFACT_ID: ${{ steps.find-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)

          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$workdir/artifact.zip"
          unzip -q "$workdir/artifact.zip" -d "$workdir/extracted"

          manifest="$workdir/extracted/manifest.json"
          encrypted="$workdir/extracted/backup.sql.age"
          if [ ! -f "$manifest" ] || [ ! -f "$encrypted" ]; then
            echo "::error::artifact did not contain manifest.json and backup.sql.age"
            exit 1
          fi

          expected_checksum=$(jq -r '.checksum_sha256' "$manifest")
          actual_checksum=$(sha256sum "$encrypted" | cut -d' ' -f1)
          if [ "$expected_checksum" != "$actual_checksum" ]; then
            echo "::error::manifest checksum_sha256 does not match downloaded artifact"
            exit 1
          fi

          keyfile="$workdir/age-key.txt"
          umask 077
          printf '%s' "$BACKUP_AGE_PRIVATE_KEY" > "$keyfile"

          plain="$workdir/dump.sql"
          age -d -i "$keyfile" -o "$plain" "$encrypted"
          shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"

          schema_migration_version=$(jq -r '.schema_migration_version' "$manifest")
          cutoff_utc=$(jq -r '.cutoff_utc' "$manifest")

          # 손상되었거나 잘못 만들어진 manifest가 "null" 문자열로 조용히 흘러들어가면, 이후
          # migration 비교 단계의 사전순 문자열 비교([[ "$fname" > "$SCHEMA_MIGRATION_VERSION" ]])가
          # 숫자로 시작하는 모든 실제 파일명에 대해 거짓이 되어(문자 'n'이 숫자보다 사전순으로 뒤라서)
          # 대기 중인 migration을 전부 "이미 적용됨"으로 잘못 판단하고 조용히 건너뛴다. 여기서
          # 크게 실패시킨다.
          if [ -z "$schema_migration_version" ] || [ "$schema_migration_version" = "null" ]; then
            echo "::error::manifest.json schema_migration_version is missing or null"
            exit 1
          fi
          if [ -z "$cutoff_utc" ] || [ "$cutoff_utc" = "null" ]; then
            echo "::error::manifest.json cutoff_utc is missing or null"
            exit 1
          fi

          echo "dump_path=$plain" >> "$GITHUB_OUTPUT"
          echo "schema_migration_version=$schema_migration_version" >> "$GITHUB_OUTPUT"
          echo "cutoff_utc=$cutoff_utc" >> "$GITHUB_OUTPUT"

      - name: Measure RPO
        id: rpo
        env:
          CUTOFF_UTC: ${{ steps.restore-prep.outputs.cutoff_utc }}
        run: |
          set -euo pipefail
          cutoff_epoch=$(date -u -d "$CUTOFF_UTC" +%s)
          now_epoch=$(date -u +%s)
          rpo_seconds=$((now_epoch - cutoff_epoch))

          # 잘못된 cutoff_utc나 러너-DB 간 시계 오차로 음수가 나오면 조용히 "이상하게 좋은 RPO"로
          # 통과시키지 않고 크게 실패시킨다.
          if [ "$rpo_seconds" -lt 0 ]; then
            echo "::error::computed RPO is negative (rpo_seconds=$rpo_seconds, cutoff_utc=$CUTOFF_UTC) -- check manifest cutoff_utc or clock skew"
            exit 1
          fi

          rpo_hours=$(awk "BEGIN { printf \"%.2f\", $rpo_seconds / 3600 }")
          echo "RPO(실측): backup cutoff_utc=$CUTOFF_UTC, drill now=$(date -u -d @"$now_epoch" +%Y-%m-%dT%H:%M:%SZ), rpo_hours=$rpo_hours (목표 <= ${RPO_LIMIT_HOURS}h)"
          echo "rpo_hours=$rpo_hours" >> "$GITHUB_OUTPUT"
          exceeded=$(awk "BEGIN { print ($rpo_hours > $RPO_LIMIT_HOURS) ? 1 : 0 }")
          echo "exceeded=$exceeded" >> "$GITHUB_OUTPUT"

      - name: Strip pg_cron/pg_net objects unavailable in disposable Postgres
        env:
          DUMP_PATH: ${{ steps.restore-prep.outputs.dump_path }}
        run: |
          # migration 202609021100_schedule_dispatch_worker_cron.sql(pg_cron 1분 스캔, AD-18)은
          # production에 이미 적용되어 있으므로, 실제 pg_dump 백업에는 pg_cron/pg_net extension
          # 생성 구문·관련 comment·cron.job 데이터(pg_cron이 pg_extension_config_dump로 표시한
          # 설정 테이블)가 그대로 포함된다. 이 migration 파일 자체는 별도 파일이라 다음 단계의
          # skip-list가 잡아내지만, "이미 dump 본문에 박혀 있는 구문"은 파일 단위 skip으로 잡을 수
          # 없다. disposable postgres:16 컨테이너에는 두 extension이 설치되어 있지 않으므로
          # (test.yml의 sql-outbox-tests job이 이 migration 파일을 건너뛰는 것과 동일한 이유) 그대로
          # psql -f 하면 CREATE EXTENSION에서 즉시 실패해 ON_ERROR_STOP=1로 전체 복원이 중단된다.
          # 복원 전에 관련 구문/데이터 블록을 제거한다.
          python3 - "$DUMP_PATH" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              lines = f.readlines()

          out = []
          skip_mode = None  # None | "copy" | "dollar" | "paren"
          for line in lines:
              stripped = line.strip()
              low = stripped.lower()

              if skip_mode == "copy":
                  if stripped == "\\.":
                      skip_mode = None
                  continue
              if skip_mode == "dollar":
                  if low.startswith("end $$"):
                      skip_mode = None
                  continue
              if skip_mode == "paren":
                  if stripped.endswith(");"):
                      skip_mode = None
                  continue

              if low.startswith("create extension") and ("pg_cron" in low or "pg_net" in low):
                  continue
              if low.startswith("comment on extension") and ("pg_cron" in low or "pg_net" in low):
                  continue
              if low.startswith("copy cron.") or low.startswith("copy net."):
                  skip_mode = "copy"
                  continue
              if "setval" in low and ("'cron." in low or "'net." in low):
                  continue
              if low.startswith("do $$"):
                  skip_mode = "dollar"
                  continue
              if "cron.schedule(" in low or "cron.unschedule(" in low or "net.http_post(" in low:
                  if not stripped.endswith(";"):
                      skip_mode = "paren"
                  continue
              if re.match(r"^(alter|grant|revoke)\b.*\b(cron|net)\.", low):
                  continue

              out.append(line)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(out)
          PY

      # backup.yml의 pg_dump --no-privileges가 GRANT/REVOKE는 걸러내지만, RLS
      # policy(create policy ... to anon, authenticated)는 별개 스키마 객체라 그대로
      # 덤프에 남는다. 순정 postgres:16에는 이 Supabase 플랫폼 롤이 없어 복원과 이후
      # migration 적용(둘 다 anon/authenticated/service_role을 참조) 모두 즉시
      # "role does not exist"로 죽는다(test.yml의 sql-schema-tests와 동일 원인,
      # 2026-09-14 조사).
      - name: Bootstrap Supabase platform roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end
          $$;

          -- 실제 Supabase는 anon/authenticated에 public 스키마 기본 권한을 광범위하게 주고
          -- RLS만으로 행을 막는다(test.yml의 sql-schema-tests 부트스트랩과 동일 이유).
          grant usage on schema public to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public
            grant all on functions to anon, authenticated, service_role;
          SQL

      - name: Restore dump into disposable Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "${{ steps.restore-prep.outputs.dump_path }}"

      - name: Apply migrations newer than backup's schema version
        env:
          PGPASSWORD: postgres
          SCHEMA_MIGRATION_VERSION: ${{ steps.restore-prep.outputs.schema_migration_version }}
        run: |
          set -euo pipefail
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            fname=$(basename "$f")
            case "$fname" in
              *schedule_dispatch_worker_cron.sql) echo "skipping $fname (requires pg_cron/pg_net, not available in CI)"; continue ;;
            esac
            if [[ "$fname" > "$SCHEMA_MIGRATION_VERSION" ]]; then
              echo "applying $fname (newer than backup schema version $SCHEMA_MIGRATION_VERSION)"
              psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
            else
              echo "skipping $fname (already present in restored dump)"
            fi
          done

      - name: Run smoke fixtures (read-model contract + canonical pointer lineage)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/test_dashboard_snapshot.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/test_run_lineage.sql

      - name: Measure RTO and enforce RPO gate
        run: |
          set -euo pipefail
          end_epoch=$(date -u +%s)
          rto_seconds=$((end_epoch - DRILL_START_EPOCH))
          rto_minutes=$(awk "BEGIN { printf \"%.2f\", $rto_seconds / 60 }")
          echo "RTO(실측, 자동화 절차 소요시간 하한): ${rto_minutes}분 (목표 <= 8시간; 사람의 실제 장애 대응 시간은 포함하지 않는다)"
          echo "RPO(실측): ${{ steps.rpo.outputs.rpo_hours }}시간 (목표 <= ${RPO_LIMIT_HOURS}시간)"

          if [ "${{ steps.rpo.outputs.exceeded }}" = "1" ]; then
            echo "::error::RPO ${{ steps.rpo.outputs.rpo_hours }}h exceeds ${RPO_LIMIT_HOURS}h target"
            exit 1
          fi

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh issue create --label은 라벨이 저장소에 미리 존재해야 하므로 실패 시점에
          # idempotent하게 먼저 만들어 둔다(backup.yml과 동일 관례).
          gh label create restore-drill-failed --color d73a4a --description "복원 드릴 실패 또는 RPO 목표 초과" --force

          # 지속 장애 시 분기(또는 반복 workflow_dispatch)마다 새 Issue가 쌓이지 않도록, 같은
          # 라벨의 열린 Issue가 이미 있으면 새로 만들지 않는다.
          existing_open=$(gh issue list --label restore-drill-failed --state open --json number --jq 'length')
          if [ "$existing_open" -gt 0 ]; then
            echo "restore-drill-failed 라벨의 열린 Issue가 이미 있어 새로 만들지 않습니다."
            exit 0
          fi

          gh issue create \
            --title "[backup] restore drill 실패 ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --label restore-drill-failed \
            --body "$(cat <<'EOF'
          backup-restore-drill.yml 워크플로가 실패했거나 RPO 목표(6시간)를 초과했습니다.

          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          필요 조치(docs/backup-restore.md 참고): 원인을 조사하고 해결하기 전까지는 production
          release를 진행하지 마세요(수동 게이트). 해결 후 workflow_dispatch로 재검증하고 이 이슈를
          닫으세요.
          EOF
          )"
