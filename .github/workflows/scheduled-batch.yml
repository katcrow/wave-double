name: scheduled-batch

on:
  schedule:
    # 2026-09-21 배치 전략 변경(Neo 확인): 평일 KST 08:10 시작, 1시간 간격으로
    # 19:10까지 intraday, 19:40에 최종 close 1회. premarket 구간은 스케줄하지
    # 않는다(수동 workflow_dispatch로는 여전히 선택 가능, 하위호환).
    # intraday: KST 08:10(월~금) = UTC 전날 23:10(일~목)
    - cron: "10 23 * * 0-4"
    # intraday: 매 KST 09:10~19:10 60분 간격(월~금) = UTC 00:10~10:10(월~금)
    - cron: "10 0-10 * * 1-5"
    # close: 매 KST 19:40(월~금) = UTC 10:40(월~금)
    - cron: "40 10 * * 1-5"
  workflow_dispatch:
    inputs:
      batch_kind:
        description: "수동 테스트용 batch kind (schedule 트리거가 아닐 때만 사용)"
        required: false
        default: "close"
        type: choice
        options:
          - premarket
          - intraday
          - close
      dispatch_request_id:
        description: "Story 1.10: outbox worker가 채우는 dispatch_request_id(사람이 직접 채우지 않는다)"
        required: false
        default: ""
        type: string
      dispatch_trigger:
        description: "outbox worker가 채우는 trigger 구분(사람이 직접 채우지 않는다): 자동 스케줄 enqueue는 schedule, 웹 UI 수동 실행은 manual"
        required: false
        default: "manual"
        type: string

concurrency:
  # 스케줄 트리거는 아직 logical_run_key(거래일·슬롯)를 모르므로 cron 문자열 단위로 근사한다.
  # workflow_dispatch(수동/outbox worker)는 github.event.schedule이 항상 빈 문자열이라 스케줄 그룹과
  # 섞이면 안 된다 -- batch_kind+dispatch_request_id로 별도 그룹을 둬서, 서로 다른 batch_kind의
  # 수동 실행이 GitHub Actions 큐에서 서로를 막지 않게 한다. 정확한 dedup은 DB fence(1.3, AD-3)가 담당한다.
  group: >-
    wave-double-${{ github.event.schedule != '' && format('schedule-{0}', github.event.schedule) ||
    format('manual-{0}-{1}', inputs.batch_kind, inputs.dispatch_request_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: "3.12.14"

      - name: Determine batch kind
        id: batch-kind
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_BATCH_KIND: ${{ inputs.batch_kind }}
        run: |
          case "$SCHEDULE" in
            "10 23 * * 0-4"|"10 0-10 * * 1-5") echo "value=intraday" >> "$GITHUB_OUTPUT" ;;
            "40 10 * * 1-5") echo "value=close" >> "$GITHUB_OUTPUT" ;;
            "") echo "value=${DISPATCH_BATCH_KIND:-close}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unrecognized schedule: $SCHEDULE" ; exit 1 ;;
          esac

      - name: Determine trigger
        id: trigger
        env:
          DISPATCH_BATCH_KIND: ${{ inputs.batch_kind }}
          DISPATCH_TRIGGER: ${{ inputs.dispatch_trigger }}
        run: |
          # workflow_dispatch 호출(outbox worker 또는 사람의 수동 테스트)에서만 inputs.batch_kind가
          # 채워진다(default "close"). schedule 이벤트에서는 항상 빈 문자열이다.
          # outbox worker는 요청자가 사람(웹 UI)인지 자동 스케줄 enqueue(마이그레이션
          # 202609151600)인지에 따라 dispatch_trigger를 manual|schedule로 채워 보낸다.
          if [ -n "$DISPATCH_BATCH_KIND" ]; then
            case "$DISPATCH_TRIGGER" in
              schedule) echo "value=schedule" >> "$GITHUB_OUTPUT" ;;
              *) echo "value=manual" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "value=schedule" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scheduled batch
        env:
          # apps/batch imports the pure workspace package as ``domain``.
          # Keep the CLI invocation identical locally and in Actions instead
          # of relying on an incidental editable-install side effect.
          PYTHONPATH: packages/domain:.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_CONDITION_SEARCH_USER_ID: ${{ secrets.LS_CONDITION_SEARCH_USER_ID }}
          LS_MAC_ADDRESS: ${{ secrets.LS_MAC_ADDRESS }}
          DISPATCH_REQUEST_ID: ${{ inputs.dispatch_request_id }}
        run: |
          args=(--batch-kind "${{ steps.batch-kind.outputs.value }}" --trigger "${{ steps.trigger.outputs.value }}")
          if [ -n "$DISPATCH_REQUEST_ID" ]; then
            args+=(--dispatch-request-id "$DISPATCH_REQUEST_ID")
          fi
          uv run --with httpx python -m apps.batch "${args[@]}"
