name: scheduled-batch

on:
  schedule:
    # premarket: 매 KST 08:30(월~금) = UTC 전날 23:30(일~목)
    - cron: "30 23 * * 0-4"
    # intraday: 매 KST 09:00~14:30 30분 간격(월~금) = UTC 00:00~05:30(월~금)
    - cron: "0,30 0-5 * * 1-5"
    # intraday: KST 15:00 슬롯 = UTC 06:00(월~금)
    - cron: "0 6 * * 1-5"
    # close: 매 KST 16:00(월~금) = UTC 07:00(월~금)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      batch_kind:
        description: "수동 테스트용 batch kind (schedule 트리거가 아닐 때만 사용)"
        required: false
        default: "close"
        type: choice
        options:
          - premarket
          - intraday
          - close
      dispatch_request_id:
        description: "Story 1.10: outbox worker가 채우는 dispatch_request_id(사람이 직접 채우지 않는다)"
        required: false
        default: ""
        type: string

concurrency:
  # 스케줄 트리거 시점에는 아직 logical_run_key(거래일·슬롯)를 알 수 없으므로
  # cron 문자열 단위로 근사한다. 정확한 dedup은 DB fence(1.3, AD-3)가 담당한다.
  group: wave-double-schedule-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-version: "0.11.28"
          python-version: "3.12.14"

      - name: Determine batch kind
        id: batch-kind
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_BATCH_KIND: ${{ inputs.batch_kind }}
        run: |
          case "$SCHEDULE" in
            "30 23 * * 0-4") echo "value=premarket" >> "$GITHUB_OUTPUT" ;;
            "0,30 0-5 * * 1-5"|"0 6 * * 1-5") echo "value=intraday" >> "$GITHUB_OUTPUT" ;;
            "0 7 * * 1-5") echo "value=close" >> "$GITHUB_OUTPUT" ;;
            "") echo "value=${DISPATCH_BATCH_KIND:-close}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unrecognized schedule: $SCHEDULE" ; exit 1 ;;
          esac

      - name: Determine trigger
        id: trigger
        env:
          DISPATCH_BATCH_KIND: ${{ inputs.batch_kind }}
        run: |
          # workflow_dispatch 호출(outbox worker 또는 사람의 수동 테스트)에서만 inputs.batch_kind가
          # 채워진다(default "close"). schedule 이벤트에서는 항상 빈 문자열이다.
          if [ -n "$DISPATCH_BATCH_KIND" ]; then
            echo "value=manual" >> "$GITHUB_OUTPUT"
          else
            echo "value=schedule" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scheduled batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_QUERY_INDEX: ${{ secrets.LS_QUERY_INDEX }}
          LS_MAC_ADDRESS: ${{ secrets.LS_MAC_ADDRESS }}
          DISPATCH_REQUEST_ID: ${{ inputs.dispatch_request_id }}
        run: |
          args=(--batch-kind "${{ steps.batch-kind.outputs.value }}" --trigger "${{ steps.trigger.outputs.value }}")
          if [ -n "$DISPATCH_REQUEST_ID" ]; then
            args+=(--dispatch-request-id "$DISPATCH_REQUEST_ID")
          fi
          uv run --with httpx python -m apps.batch "${args[@]}"
