name: scheduled-batch

on:
  # 자동 배치는 Supabase pg_cron -> outbox -> workflow_dispatch 단일 경로만 사용한다.
  # GitHub schedule은 지연되어 장외에 실행될 수 있으므로 유지하지 않는다.
  workflow_dispatch:
    inputs:
      batch_kind:
        description: "수동 테스트용 batch kind (schedule 트리거가 아닐 때만 사용)"
        required: false
        default: "close"
        type: choice
        options:
          - premarket
          - intraday
          - close
      dispatch_request_id:
        description: "Story 1.10: outbox worker가 채우는 dispatch_request_id(사람이 직접 채우지 않는다)"
        required: false
        default: ""
        type: string
      logical_run_key:
        description: "outbox row가 저장한 logical_run_key (자동 실행에서는 필수)"
        required: false
        default: ""
        type: string
      dispatch_trigger:
        description: "outbox worker가 채우는 trigger 구분(사람이 직접 채우지 않는다): 자동 스케줄 enqueue는 schedule, 웹 UI 수동 실행은 manual"
        required: false
        default: "manual"
        type: string

concurrency:
  # workflow_dispatch만 남기며, 정확한 dedup은 outbox idempotency와 DB fence가 담당한다.
  group: >-
    wave-double-${{ github.event.schedule != '' && format('schedule-{0}', github.event.schedule) ||
    format('manual-{0}-{1}', inputs.batch_kind, inputs.dispatch_request_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    # 관측 최장 실행은 약 8분이다. 멈춘 실행이 기본값(6시간) 동안 남지 않게 한다.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: "3.12.14"

      - name: Determine batch kind
        id: batch-kind
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_BATCH_KIND: ${{ inputs.batch_kind }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            echo "::error::GitHub schedule triggers are disabled; use Supabase outbox workflow_dispatch";
            exit 1;
          fi
          case "${DISPATCH_BATCH_KIND:-}" in
            premarket|intraday|close) echo "value=$DISPATCH_BATCH_KIND" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::workflow_dispatch requires a valid batch_kind"; exit 1 ;;
          esac

      - name: Determine trigger
        id: trigger
        env:
          DISPATCH_BATCH_KIND: ${{ inputs.batch_kind }}
          DISPATCH_TRIGGER: ${{ inputs.dispatch_trigger }}
          DISPATCH_REQUEST_ID: ${{ inputs.dispatch_request_id }}
          LOGICAL_RUN_KEY: ${{ inputs.logical_run_key }}
        run: |
          case "$DISPATCH_TRIGGER" in
            schedule|manual) echo "value=$DISPATCH_TRIGGER" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::dispatch_trigger must be schedule or manual"; exit 1 ;;
          esac
          if [ "$DISPATCH_TRIGGER" = "schedule" ] && { [ -z "$DISPATCH_REQUEST_ID" ] || [ -z "$LOGICAL_RUN_KEY" ]; }; then
            echo "::error::scheduled dispatch requires dispatch_request_id and logical_run_key"; exit 1
          fi

      - name: Run scheduled batch
        env:
          # apps/batch imports the pure workspace package as ``domain``.
          # Keep the CLI invocation identical locally and in Actions instead
          # of relying on an incidental editable-install side effect.
          PYTHONPATH: packages/domain:.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_CONDITION_SEARCH_USER_ID: ${{ secrets.LS_CONDITION_SEARCH_USER_ID }}
          LS_MAC_ADDRESS: ${{ secrets.LS_MAC_ADDRESS }}
          DISPATCH_REQUEST_ID: ${{ inputs.dispatch_request_id }}
          LOGICAL_RUN_KEY: ${{ inputs.logical_run_key }}
        run: |
          args=(--batch-kind "${{ steps.batch-kind.outputs.value }}" --trigger "${{ steps.trigger.outputs.value }}")
          if [ -n "$DISPATCH_REQUEST_ID" ]; then
            args+=(--dispatch-request-id "$DISPATCH_REQUEST_ID")
          fi
          if [ -n "$LOGICAL_RUN_KEY" ]; then
            args+=(--logical-run-key "$LOGICAL_RUN_KEY")
          fi
          # 예약 배치는 KST 20:00 이후 작업 중이면 안 된다. 시작 guard(intraday 19:30,
          # close 19:50 마감)를 통과했더라도 20:00에 프로세스를 강제 종료한다.
          # manual은 기존 수동 실행 계약을 유지한다(job timeout만 적용).
          if [ "${{ steps.trigger.outputs.value }}" = "schedule" ]; then
            # KST(UTC+9, DST 없음)의 오늘 20:00 = UTC 11:00. tz 데이터베이스에 의존하지 않는다.
            kst_today=$(date -u -d '+9 hours' +%F)
            remaining=$(( $(date -u -d "${kst_today} 11:00" +%s) - $(date -u +%s) ))
            if [ "$remaining" -le 0 ]; then
              echo "batch_kind=${{ steps.batch-kind.outputs.value }} status=skipped result_code=SCHEDULE_PAST_HARD_DEADLINE"
              exit 0
            fi
            set +e
            timeout --kill-after=20s "${remaining}s" uv run --with httpx python -m apps.batch "${args[@]}"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error::scheduled batch terminated at KST 20:00 hard deadline"
            fi
            exit "$status"
          fi
          uv run --with httpx python -m apps.batch "${args[@]}"
