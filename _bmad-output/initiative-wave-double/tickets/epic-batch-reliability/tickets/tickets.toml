[[entry]]
id = 1
type = "spike"
title = "배포·CI·운영 스키마의 현재 기준을 확보한다"
description = "현재 SHA·배포 SHA·최신 CI와 운영 migration/RPC/권한을 대조하고 이후 검증이 사용할 run/day 및 증거 위치를 남긴다. 기존 정상 배치 한 건을 dispatch→run→publish→후보 화면으로 읽기 추적해 얇은 전체 경로를 확보한다."
verify = "동일 배포 기준의 CI 결과와 운영 대조표에서 통과·실패·미확인을 구분할 수 있다. 기존 정상 배치 한 건의 dispatch→run→publish→후보 화면 경로를 읽기 조회와 Playwright MCP로 연결한다."
covers = ["R1"]
after = []
hitl = false
risk = "medium"

[[entry]]
