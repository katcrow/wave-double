type = "spike"
title = "자동 배치부터 화면 발행까지 수명주기를 검증한다"
description = "1.1의 기준으로 cron→outbox→worker→GitHub dispatch→배치→publish를 추적한다. 정상·휴장·부분실패·중복 재시도·운영창 경계를 기존 계약과 대조한다. 운영 실행·재시도 검증창과 결과는 이 항목이 소유하며 2.3에 전달한다."
verify = "run_id·logical_run_key·거래일로 배치와 발행 화면을 연결하고 중복 발행·실패 숨김 여부를 판정한 증거가 있다."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"

